services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoneme-app
    ports:
      - "80:3000"
    depends_on:
      - postgres
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@postgres:5432/phonemedb
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: phoneme-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: phonemedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
